[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxils-open"
version = "0.1.0"
description = "Clean-room, standard-library download manager MVP"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Pyxils Open contributors" }]
dependencies = ["pycryptodome==3.23.0"]

[project.scripts]
pyxils-open = "pyxils_open.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
